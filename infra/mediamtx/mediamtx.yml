# MediaMTX v1.21.3 설정. 명시하지 않은 항목은 기본값을 따른다.
# 기본값 전체: https://github.com/bluenviron/mediamtx/blob/v1.21.3/mediamtx.yml
# 환경변수로 덮어쓸 수 있다. 예) MTX_WEBRTCADDITIONALHOSTS=galle.cloud

logLevel: info

# 사용하지 않는 프로토콜은 끈다 (메모리 절약, 공격 면 축소)
rtsp: no
rtmp: no
hls: no
srt: no
moq: no

# Control API: api 컨테이너가 path 상태 조회와 송출 강제 종료에 사용한다 (외부 비공개)
api: yes
apiAddress: :9997

# 녹화 재생 서버. 다시보기는 Caddy가 웹용 mp4 파일을 직접 서빙하므로 쓰지 않는다 (#12)
playback: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# UDP가 막힌 네트워크(일부 이동통신망·사내망)를 위한 ICE-TCP 폴백
webrtcLocalTCPAddress: :8189
# 컨테이너 내부 IP는 외부에서 도달할 수 없으므로 광고하지 않는다.
# 대신 MTX_WEBRTCADDITIONALHOSTS로 공인 도메인/IP(로컬에서는 PC의 LAN IP)를 지정한다.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: []
# 송출이 붙은 뒤 모든 트랙의 첫 패킷을 기다리는 시간(기본 2s). 이 안에 패킷이 없는 트랙은 버려진다.
# 휴대폰·저사양 PC는 영상 인코더 시작이 늦어 첫 녹화 구간이 오디오만 남는 일이 있었다(#12 E2E) → 여유를 둔다
webrtcTrackGatherTimeout: 5s

# 인가는 api에 위임한다. publish/read 요청마다 api의 /internal/media/auth를 호출하고, 2xx면 허용한다.
#   publish: 소유자에게 발급한 publish 토큰(WHIP Authorization: Bearer) + 방송 상태(READY/LIVE)
#   read:    방송 중(LIVE)이면 누구나
# 실제 주소는 compose의 MTX_AUTHHTTPADDRESS가 덮어쓴다 (공유 시크릿을 쿼리로 붙인다)
authMethod: http
authHTTPAddress: http://api:3000/internal/media/auth
# Control API는 api 컨테이너만 쓴다. 9997 포트는 외부에 공개하지 않으므로 HTTP 인가에서 제외한다.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

pathDefaults:
  # 같은 방송에 새 송출이 들어오면 기존 송출을 대체한다 (탭 중복, 재연결)
  overridePublisher: yes
  # 기본값 1d면 녹화가 하루 뒤 삭제된다. 영구 저장 요구사항 때문에 끈다.
  recordDeleteAfter: 0s
  recordFormat: fmp4
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f_%z
  # 방송 중 세그먼트를 나누는 주기. 송출이 끝나면 그 시점까지가 한 세그먼트로 닫힌다.
  recordSegmentDuration: 1h
  record: no

  # 상태 머신 입력. 훅이 유실돼도 #6의 Control API 주기 대조로 보정한다.
  runOnOnline: sh /hooks/notify.sh online
  runOnOffline: sh /hooks/notify.sh offline
  # 세그먼트가 닫히면 웹용 mp4(영상 복사 + 오디오 AAC, faststart)로 바꾼 뒤 api에 등록한다 (#12)
  runOnRecordSegmentComplete: sh /hooks/segment.sh

paths:
  # 방송 회차 하나 = path 하나 (live/{broadcastId})
  "~^live/[0-9]+$":
    record: yes
