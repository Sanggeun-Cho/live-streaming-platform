name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck & build
        run: npm run typecheck
      - name: Test (api 통합 + web 단위)
        run: npm test
      - name: Validate compose file
        run: INTERNAL_SECRET=ci-dummy-secret-value docker compose config --quiet
