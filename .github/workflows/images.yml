name: Images

# 서버(Oracle VM)는 빌드하지 않고 여기서 만든 이미지를 pull만 한다 (docs/INFRA_SETUP.md §1 원칙).
# amd64(현재 E2.1.Micro)와 arm64(A1 이전 대비)를 함께 빌드한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 배포 중인 실행을 중간에 끊지 않는다 (새 push는 앞 실행이 끝난 뒤 이어서 돈다)
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: caddy
            dockerfile: infra/caddy/Dockerfile
          - service: api
            dockerfile: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 이미지 이름은 소문자여야 한다
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 이미지가 올라가면 운영 서버에 SSH로 접속해 배포한다 (docs/INFRA_SETUP.md §6-4).
  # 서버의 authorized_keys가 이 키에 강제 명령(git pull → scripts/deploy.sh)을 걸어 두므로, 키로는 배포 외의 일을 할 수 없다.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://galle.cloud
    env:
      SITE_URL: https://galle.cloud
    steps:
      - name: 배포 설정 확인
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::DEPLOY_* 시크릿 4개 중 빠진 것이 있어 자동 배포를 건너뜁니다. 서버에서 직접 배포하세요 (docs/INFRA_SETUP.md §6-3)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 서버에 배포
        if: steps.check.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 실행할 명령은 서버가 정한다(강제 명령). 호스트 키가 등록값과 다르면 접속하지 않는다
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: 운영 버전 확인
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in $(seq 1 24); do
            version=$(curl -fsS "$SITE_URL/api/health" | jq -r .version) || version=unreachable
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "운영 버전 확인: $version"
              exit 0
            fi
            sleep 5
          done
          echo "::error::운영 /api/health 버전이 $GITHUB_SHA가 아닙니다 (현재 $version)"
          exit 1
