<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>galle LIVE | 실시간 라이브 방송</title>
    <meta
      name="description"
      content="설치 없이 브라우저에서 바로 방송하고 시청하는 실시간 라이브 플랫폼. 채팅·후원·다시보기를 지원합니다."
    />
    <meta name="theme-color" content="#0e1117" />
    <!-- 첫 화면이 그려지기 전에 테마를 정해 깜빡임을 막는다. 저장한 선택이 없으면 기기 설정을 따른다 (src/theme/theme.ts와 같은 키) -->
    <script>
      ;(function () {
        var pref
        try {
          pref = localStorage.getItem('galle-theme')
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0e1117' : '#ffffff'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="galle LIVE" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://galle.cloud/" />
    <meta property="og:title" content="galle LIVE | 실시간 라이브 방송" />
    <meta
      property="og:description"
      content="설치 없이 브라우저에서 바로 방송하고 시청하는 실시간 라이브 플랫폼. 채팅·후원·다시보기를 지원합니다."
    />
    <meta property="og:image" content="https://galle.cloud/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="galle LIVE 로고와 실시간 라이브 방송 소개 문구" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Pretendard: 쓰는 글자 범위의 조각만 받는 동적 서브셋 (font-display: swap 포함) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
